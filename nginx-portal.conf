# ============================================================
#  伪静态配置 — Nginx
#  用法：把 server 块合并进你的站点配置（或 include 本文件）。
#  请按实际环境修改 root、server_name、fastcgi_pass。
# ============================================================

server {
    listen 80;
    server_name portal.example.com;          # 改成你的域名 / IP

    root /var/www/portal-php;                # 改成门户项目实际路径
    index index.php;

    charset utf-8;

    # ---------- 伪静态路由 ----------
    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        # 前台
        rewrite ^/index\.html$          /index.php                break;
        rewrite ^/login\.html$          /login.php                break;
        rewrite ^/logout\.html$         /logout.php               break;
        rewrite ^/password\.html$       /my_password.php          break;
        rewrite ^/settings\.html$       /settings.php             break;
        rewrite ^/mynav\.html$          /my_nav.php               break;
        rewrite ^/about\.html$          /about.php                break;
        rewrite ^/theme\.html$          /theme.php                break;
        rewrite ^/jump/([0-9]+)\.html$  /jump.php?id=$1           break;

        # 后台
        rewrite ^/admin/index\.html$    /admin/index.php          break;
        rewrite ^/admin/navgroups\.html$ /admin/nav_groups.php    break;
        rewrite ^/admin/navs\.html$     /admin/nav.php            break;
        rewrite ^/admin/groups\.html$   /admin/groups.php         break;
        rewrite ^/admin/permissions\.html$ /admin/permissions.php break;
        rewrite ^/admin/users\.html$    /admin/users.php          break;
        rewrite ^/admin/usernavs\.html$ /admin/user_navs.php      break;
        rewrite ^/admin/engines\.html$  /admin/engines.php        break;
        rewrite ^/admin/import\.html$   /admin/import.php         break;
        rewrite ^/admin/logs\.html$     /admin/logs.php           break;
        rewrite ^/admin/searchlogs\.html$ /admin/search_logs.php  break;
        rewrite ^/admin/settings\.html$ /admin/settings.php       break;
        rewrite ^/admin/themes\.html$   /admin/themes.php         break;
        rewrite ^/admin/about\.html$    /admin/about.php          break;

        return 404;
    }

    # PHP 处理（按你的 PHP-FPM socket/端口修改）
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;   # 或 127.0.0.1:9000
        fastcgi_index index.php;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 禁止访问隐藏文件与数据文件
    location ~ /\. { deny all; }
    location ~* \.(sqlite|sql|log|md)$ { deny all; }
}
