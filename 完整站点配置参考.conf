# ⚠️⚠️⚠️ 重要警告（请先读）⚠️⚠️⚠️
# 本文件是一个完整的 server{...} 配置块，只供【整体替换/核对宝塔站点配置】时参考。
# 千万不要把它粘贴进「宝塔 → 网站 → 设置 → 伪静态」输入框！
# 宝塔伪静态框只接受 rewrite 规则行（server 级指令），贴 server{} 会报错：
#   [emerg] "server" directive is not allowed here
# 需要粘贴进伪静态框的内容，请看同目录下的 baota-nginx-伪静态规则.txt。
# ============================================================
#  宝塔面板 完整站点配置参考（Nginx）
#
#  通常你不需要手动写整个 server 块——宝塔面板会生成。只需把
#  baota-nginx-伪静态规则.txt 里的规则粘贴到
#  「网站 → 设置 → 伪静态」即可。
#
#  下面这份完整配置用于：想整体替换/核对宝塔站点配置时参考，
#  其中 PHP 处理仍交给宝塔的 include enable-php-XX.conf;，
#  伪静态规则放在 server 级（与宝塔 rewrite 目录加载方式一致）。
# ============================================================

server {
    listen 80;
    #listen 443 ssl;                      # 如需 HTTPS，宝塔会自动加 SSL 段
    server_name yourdomain.com;           # 改成你的域名 / IP

    index index.php index.html index.htm;
    root /www/wwwroot/yourdomain.com/portal-php;   # 改成门户项目实际路径

    # ---------- 伪静态规则（= 面板「伪静态」里粘贴的内容） ----------
    rewrite ^/index\.html$          /index.php                last;
    rewrite ^/login\.html$          /login.php                last;
    rewrite ^/logout\.html$         /logout.php               last;
    rewrite ^/password\.html$       /my_password.php          last;
    rewrite ^/settings\.html$       /settings.php             last;
    rewrite ^/mynav\.html$          /my_nav.php               last;
    rewrite ^/about\.html$          /about.php                last;
    rewrite ^/theme\.html$          /theme.php                last;
    rewrite ^/jump/([0-9]+)\.html$  /jump.php?id=$1           last;
    rewrite ^/admin/index\.html$    /admin/index.php          last;
    rewrite ^/admin/navgroups\.html$ /admin/nav_groups.php    last;
    rewrite ^/admin/navs\.html$     /admin/nav.php            last;
    rewrite ^/admin/groups\.html$   /admin/groups.php         last;
    rewrite ^/admin/permissions\.html$ /admin/permissions.php last;
    rewrite ^/admin/users\.html$    /admin/users.php          last;
    rewrite ^/admin/usernavs\.html$ /admin/user_navs.php      last;
    rewrite ^/admin/engines\.html$  /admin/engines.php        last;
    rewrite ^/admin/import\.html$   /admin/import.php         last;
    rewrite ^/admin/logs\.html$   /admin/logs.php           last;
    rewrite ^/admin/searchlogs\.html$ /admin/search_logs.php last;
    rewrite ^/admin/settings\.html$ /admin/settings.php       last;
    rewrite ^/admin/themes\.html$   /admin/themes.php         last;
    rewrite ^/admin/about\.html$    /admin/about.php          last;
    # ------------------------------------------------------------

    # ---------- PHP 处理（宝塔自动生成，按你的 PHP 版本） ----------
    include enable-php-74.conf;     # 例如 PHP 7.4 用 enable-php-74.conf
                                    # PHP 8.x 用 enable-php-80/81/82/83.conf
    # --------------------------------------------------------------

    # 静态资源缓存（可选）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 禁止访问隐藏文件与数据文件
    location ~ /\. { deny all; }
    location ~* \.(sqlite|sql|log|md)$ { deny all; }
}
